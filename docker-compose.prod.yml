version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: leareng-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: leareng
      MYSQL_USER: leareng
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - leareng-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leareng-backend-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: leareng
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/leareng?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # 프로덕션 CORS 설정
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - leareng-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leareng-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - leareng-network

volumes:
  mysql_data:

networks:
  leareng-network:
    driver: bridge

