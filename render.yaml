services:
  # MySQL 데이터베이스 (Docker 이미지 사용)
  - type: web
    name: leareng-mysql
    env: docker
    dockerfilePath: ./mysql/Dockerfile
    dockerContext: ./mysql
    plan: starter
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: leareng
      - key: MYSQL_USER
        value: leareng
      - key: MYSQL_PASSWORD
        generateValue: true
    numInstances: 1

  # Spring Boot 백엔드
  - type: web
    name: leareng-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DB_USERNAME
        value: leareng
      - key: DB_PASSWORD
        sync: false  # MySQL 서비스의 MYSQL_PASSWORD와 동일한 값으로 수동 설정 필요
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://leareng-mysql:3306/leareng?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: leareng-frontend
          type: web
          property: host
          format: https://${host}
    healthCheckPath: /api/auth/login

  # Nginx 프론트엔드
  - type: web
    name: leareng-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: BACKEND_URL
        fromService:
          name: leareng-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

